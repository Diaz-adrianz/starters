name: starters

services:
  # ------------------------------------------------------------------
  # Apps
  # ------------------------------------------------------------------
  app-nestjs-typeorm-postgre:
    build:
      context: ./apps/nestjs-typeorm-postgre
      dockerfile: Dockerfile
    ports:
      - '127.0.0.1:5001:5001'
    env_file:
      - ./apps/nestjs-typeorm-postgre/.env
    volumes:
      - ./apps/nestjs-typeorm-postgre/logs:/usr/src/app/logs
      - ./apps/nestjs-typeorm-postgre/secrets:/usr/src/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  app-vite-react-shadcn:
    build:
      context: ./apps/vite-react-shadcn
      dockerfile: Dockerfile
    ports:
      - '127.0.0.1:5173:80'
    restart: unless-stopped

  # ------------------------------------------------------------------
  # SeaweedFS
  # ------------------------------------------------------------------
  seaweedfs-master:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-master
    command: master -ip.bind=0.0.0.0 -port=${SEAWEEDFS_MASTER_PORT}
    volumes:
      - seaweedfs-master-data:/data
    restart: unless-stopped

  seaweedfs-volume:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-volume
    command: volume -mserver=seaweedfs-master:${SEAWEEDFS_MASTER_PORT} -port=${SEAWEEDFS_VOLUME_PORT} -ip.bind=0.0.0.0
    volumes:
      - seaweedfs-volume-data:/data
    depends_on:
      - seaweedfs-master
    restart: unless-stopped

  seaweedfs-filer:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-filer
    command: filer -master=seaweedfs-master:${SEAWEEDFS_MASTER_PORT} -port=${SEAWEEDFS_FILER_PORT} -ip.bind=0.0.0.0
    volumes:
      - seaweedfs-filer-data:/data
    depends_on:
      - seaweedfs-master
      - seaweedfs-volume
    restart: unless-stopped

  seaweedfs-s3:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-s3
    command: s3 -filer=seaweedfs-filer:${SEAWEEDFS_FILER_PORT} -port=${SEAWEEDFS_S3_PORT} -ip.bind=0.0.0.0 -config=/etc/seaweedfs/s3-config.json
    volumes:
      - ./seaweedfs/s3-config.json:/etc/seaweedfs/s3-config.json
    depends_on:
      - seaweedfs-filer
    restart: unless-stopped
    ports:
      - ${SEAWEEDFS_S3_PORT}:${SEAWEEDFS_S3_PORT}

  seaweedfs-admin:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-admin
    command: 'admin -masters="seaweedfs-master:${SEAWEEDFS_MASTER_PORT}" -port=${SEAWEEDFS_ADMIN_PORT} -adminUser=${SEAWEEDFS_ADMIN_USER} -adminPassword=${SEAWEEDFS_ADMIN_PASSWORD} -dataDir=/data'
    volumes:
      - seaweedfs-admin-data:/data
    depends_on:
      - seaweedfs-master
    restart: unless-stopped
    ports:
      - ${SEAWEEDFS_ADMIN_PORT}:${SEAWEEDFS_ADMIN_PORT}

  seaweedfs-init:
    image: amazon/aws-cli
    entrypoint: ['/bin/sh', '-c', 'for f in /init-scripts/*.sh; do sh "$$f"; done']
    depends_on:
      seaweedfs-s3:
        condition: service_started
    environment:
      - S3_ENDPOINT=http://seaweedfs-s3:${SEAWEEDFS_S3_PORT}
      - S3_BUCKETS=${SEAWEEDFS_BUCKETS}
      - S3_TMP_EXPIRES=${SEAWEEDFS_TMP_EXPIRES}
      - AWS_ACCESS_KEY_ID=${SEAWEEDFS_CLI_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${SEAWEEDFS_CLI_SECRET_ACCESS_KEY}
    volumes:
      - ./seaweedfs/init:/init-scripts:ro
    restart: 'no'

  # ------------------------------------------------------------------
  # Databases
  # ------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - '6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:18
    restart: unless-stopped
    env_file:
      - ./postgres/.env
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ADMIN_USER: ${MYSQL_ADMIN_USER}
      MYSQL_ADMIN_PASSWORD: ${MYSQL_ADMIN_PASSWORD}
      MYSQL_ADMIN_ALLOWED_HOSTS: ${MYSQL_ADMIN_ALLOWED_HOSTS}
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    ports:
      - '3306:3306'

  # ------------------------------------------------------------------
  # misc
  # ------------------------------------------------------------------
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    init: true
    env_file:
      - ./n8n/.env
    ports:
      - '127.0.0.1:5678:5678'
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/local-files:/files

volumes:
  seaweedfs-master-data:
  seaweedfs-volume-data:
  seaweedfs-filer-data:
  seaweedfs-admin-data:
  redis-data:
  postgres-data:
  mysql-data:
  n8n-data:

