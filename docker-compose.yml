name: starters

services:
  # ------------------------------------------------------------------
  # Apps
  # ------------------------------------------------------------------
  app-nestjs-typeorm-postgre:
    build:
      context: ./apps/nestjs-typeorm-postgre
      dockerfile: Dockerfile
    env_file:
      - ./apps/nestjs-typeorm-postgre/.env
    volumes:
      - ./apps/nestjs-typeorm-postgre/logs:/usr/src/app/logs
      - ./apps/nestjs-typeorm-postgre/secrets:/usr/src/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - '127.0.0.1:5001:5001'

  app-vite-react-shadcn:
    build:
      context: ./apps/vite-react-shadcn
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:5173:80'

  # ------------------------------------------------------------------
  # SeaweedFS
  # ------------------------------------------------------------------
  seaweedfs-master:
    image: chrislusf/seaweedfs:latest
    command: master -ip=seaweedfs-master -port=9333 -mdir=/data
    volumes:
      - seaweedfs-master-data:/data
    restart: unless-stopped

  seaweedfs-volume:
    image: chrislusf/seaweedfs:latest
    command: volume -mserver=seaweedfs-master:9333 -ip=seaweedfs-volume -port=8080 -dir=/data
    volumes:
      - seaweedfs-volume-data:/data
    depends_on:
      - seaweedfs-master
    restart: unless-stopped

  seaweedfs-filer:
    image: chrislusf/seaweedfs:latest
    command: filer -master=seaweedfs-master:9333 -ip=seaweedfs-filer -port=8888 -defaultStoreDir=/data
    volumes:
      - seaweedfs-filer-data:/data
    depends_on:
      - seaweedfs-master
      - seaweedfs-volume
    restart: unless-stopped

  seaweedfs-s3:
    image: chrislusf/seaweedfs:latest
    command: s3 -filer=seaweedfs-filer:8888 -port=8333 -config=/etc/seaweedfs/s3-config.json
    volumes:
      - ./seaweedfs/s3-config.json:/etc/seaweedfs/s3-config.json
    depends_on:
      - seaweedfs-filer
    restart: unless-stopped
    ports:
      - 127.0.0.1:8333:8333

  seaweedfs-admin:
    image: chrislusf/seaweedfs:latest
    command: admin -master=seaweedfs-master:9333 -port=23646 -dataDir=/data -adminUser=${SEAWEEDFS_ADMIN_USER} -adminPassword=${SEAWEEDFS_ADMIN_PASSWORD}
    volumes:
      - seaweedfs-admin-data:/data
    depends_on:
      - seaweedfs-master
      - seaweedfs-filer
    restart: unless-stopped
    ports:
      - 127.0.0.1:23646:23646

  # ------------------------------------------------------------------
  # Databases
  # ------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    ports:
      - '6379'

  postgres:
    image: postgres:18
    restart: unless-stopped
    env_file:
      - ./postgres/.env
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - '127.0.0.1:5433:5432'

  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ADMIN_USER: ${MYSQL_ADMIN_USER}
      MYSQL_ADMIN_PASSWORD: ${MYSQL_ADMIN_PASSWORD}
      MYSQL_ADMIN_ALLOWED_HOSTS: ${MYSQL_ADMIN_ALLOWED_HOSTS}
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    ports:
      - '3306:3306'

  # ------------------------------------------------------------------
  # misc
  # ------------------------------------------------------------------
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    init: true
    env_file:
      - ./n8n/.env
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/local-files:/files
    ports:
      - '127.0.0.1:5678:5678'

volumes:
  seaweedfs-master-data:
  seaweedfs-volume-data:
  seaweedfs-filer-data:
  seaweedfs-admin-data:
  redis-data:
  postgres-data:
  mysql-data:
  n8n-data:

