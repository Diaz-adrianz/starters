server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location = /js/firebase-messaging-sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}